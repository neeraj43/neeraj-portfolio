<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #0a0c11;
        font-family: Inter, system-ui, sans-serif;
        color: #f1f3f7;
        position: relative;
      }
      .wash {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(ellipse 70% 60% at 20% 0%, rgba(90,130,210,0.30), transparent 68%),
          radial-gradient(ellipse 55% 55% at 92% 20%, rgba(200,152,96,0.22), transparent 70%);
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(33,39,51,0.9) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(33,39,51,0.9) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 30% 10%, #000 10%, transparent 78%);
      }
      .row { position: relative; display: flex; align-items: center; gap: 64px; height: 100%; padding: 0 72px; }
      .chip {
        display: inline-flex; align-items: center; gap: 10px;
        border: 1px solid #212733; background: #10131a;
        border-radius: 999px; padding: 8px 16px;
        font-size: 17px; color: #a3acbc;
      }
      .dot { width: 9px; height: 9px; border-radius: 999px; background: #34d399; }
      .role {
        font-family: "JetBrains Mono", monospace; font-size: 16px;
        letter-spacing: 0.16em; text-transform: uppercase; color: #93b4f5;
        margin: 30px 0 14px;
      }
      h1 { font-size: 62px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; }
      .name { margin-top: 26px; font-size: 24px; color: #a3acbc; }
      .name b { color: #f1f3f7; font-weight: 600; }
      .photo {
        width: 340px; height: 340px; flex: 0 0 340px;
        border-radius: 36px; object-fit: cover;
        border: 1px solid #212733;
        box-shadow: 0 40px 90px -30px rgba(90,130,210,0.6);
        filter: brightness(0.92) contrast(1.03);
      }
      .rule {
        position: absolute; left: 72px; right: 72px; bottom: 46px;
        display: flex; justify-content: space-between; align-items: center;
        font-family: "JetBrains Mono", monospace; font-size: 15px;
        letter-spacing: 0.14em; text-transform: uppercase; color: #7b8598;
        border-top: 1px solid #212733; padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="grid"></div>

    <div class="row">
      <div style="flex:1">
        <span class="chip"><span class="dot"></span>Open to Lead / Staff AI engineering roles</span>
        <p class="role">AI Engineer &amp; Lead</p>
        <h1>I build agentic AI systems that survive production.</h1>
        <p class="name"><b>Neeraj Wadhwani</b> · JPMorgan Chase</p>
      </div>
      <img class="photo" src="../public/neeraj-960.jpg" alt="" />
    </div>

    <div class="rule">
      <span>neerajwadhwani.com</span>
      <span>Evals · Guardrails · Cost &amp; latency · Adoption</span>
    </div>
  </body>
</html>
